<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPU Tycoon - Start Your Empire</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div id="game-container">
        <!-- Main Game UI -->
        <header>
            <h1>CPU Tycoon</h1>
            <div class="game-info">
                <span id="year-display">Year: 1980</span>
                <span id="money-display">Money: $1,000,000</span>
                <span id="reputation-display">Reputation: 0</span>
            </div>
        </header>

        <main>
            <!-- Navigation Tabs -->
            <nav class="game-nav">
                <button class="nav-btn active" data-tab="overview">Overview</button>
                <button class="nav-btn" data-tab="research">Research</button>
                <button class="nav-btn" data-tab="design">Design CPU</button>
                <button class="nav-btn" data-tab="manufacturing">Manufacturing</button>
                <button class="nav-btn" data-tab="market">Market</button>
                <button class="nav-btn" data-tab="cpus">My CPUs</button>
            </nav>

            <!-- Tab Content -->
            <div class="tab-content">
                <!-- Overview Tab -->
                <div id="overview-tab" class="tab active">
                    <h2>Company Overview</h2>
                    <div class="overview-grid">
                        <div class="card">
                            <h3>Resources</h3>
                            <div id="resources-list"></div>
                        </div>
                        <div class="card">
                            <h3>Recent Events</h3>
                            <div id="events-list"></div>
                        </div>
                    </div>
                </div>

                <!-- Research Tab -->
                <div id="research-tab" class="tab">
                    <h2>Research & Development</h2>
                    <div class="research-grid" id="research-grid"></div>
                </div>

                <!-- Design CPU Tab -->
                <div id="design-tab" class="tab">
                    <h2>CPU Design Studio</h2>
                    <div id="design-container"></div>
                </div>

                <!-- Manufacturing Tab -->
                <div id="manufacturing-tab" class="tab">
                    <h2>CPU Manufacturing</h2>
                    <div class="manufacturing-section">
                        <div class="card">
                            <h3>Available CPU Designs</h3>
                            <div id="cpu-designs-list"></div>
                        </div>
                        <div class="card">
                            <h3>Production Queue</h3>
                            <div id="production-queue"></div>
                        </div>
                    </div>
                </div>

                <!-- Market Tab -->
                <div id="market-tab" class="tab">
                    <h2>Market & Sales</h2>
                    <div class="market-section">
                        <div class="card">
                            <h3>Sell CPUs</h3>
                            <div id="sell-cpus-list"></div>
                        </div>
                        <div class="card">
                            <h3>Market Trends</h3>
                            <div id="market-trends"></div>
                        </div>
                    </div>
                </div>

                <!-- My CPUs Tab -->
                <div id="cpus-tab" class="tab">
                    <h2>My CPU Lineup</h2>
                    <div id="cpus-lineup"></div>
                </div>
            </div>
        </main>

        <!-- Action Buttons -->
        <footer>
            <button id="next-year-btn" class="primary-btn">Next Year (Speed: 1x)</button>
            <div class="speed-controls">
                <button class="speed-btn" data-speed="2">2x</button>
                <button class="speed-btn" data-speed="5">5x</button>
                <button class="speed-btn" data-speed="10">10x</button>
            </div>
        </footer>
    </div>

    <script src="js/game-state.js"></script>
    <script src="js/game-engine.js"></script>
    <script src="js/cpu-designer.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
