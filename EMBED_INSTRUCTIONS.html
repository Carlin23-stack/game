<!-- CPU Tycoon - Embed Code for Your Website -->

<!-- EMBED CODE - Copy this to your website -->
<iframe 
    id="cpu-tycoon-embed" 
    src="https://Carlin23-stack.github.io/game/embed.html" 
    width="100%" 
    height="800" 
    style="border: none; border-radius: 10px; box-shadow: 0 8px 32px rgba(0, 212, 255, 0.2);"
    allow="localStorage"
    title="CPU Tycoon Game">
</iframe>

<!-- Alternative: Full-Screen Embed -->
<style>
    .cpu-tycoon-fullscreen {
        width: 100vw;
        height: 100vh;
        border: none;
        position: fixed;
        top: 0;
        left: 0;
    }
</style>
